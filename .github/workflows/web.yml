name: Build and deploy web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install latest stable Godot and export templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api repos/godotengine/godot/releases/latest --jq .tag_name)
          echo "Using Godot $VERSION"
          BASE="https://github.com/godotengine/godot/releases/download/$VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSL -o godot.zip "$BASE/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${VERSION}_linux.x86_64" godot
          chmod +x godot
          curl -fsSL -o templates.tpz "$BASE/Godot_v${VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/"${VERSION/-/.}"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Export web build
        run: |
          mkdir -p build/web
          set +e
          godot --headless --import > import.log 2>&1
          godot --headless --export-release "Web" build/web/index.html > export.log 2>&1
          set -e
          cat import.log export.log
          if [ ! -f build/web/index.html ]; then
            # Surface the error as annotations so they show in the run summary.
            ls ~/.local/share/godot/export_templates/ > templates.txt
            MSG=$( { echo "templates: $(cat templates.txt)"; cat import.log export.log | sed 's/\x1b\[[0-9;]*m//g' | grep -iE -A6 "error|fail|warn|template|missing|invalid" | head -n 40; } | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Godot export failed::$MSG"
            exit 1
          fi
          ls -la build/web

      - name: Enable GitHub Pages if needed
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
